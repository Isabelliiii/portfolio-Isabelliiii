project:
  type: website
  output-dir: docs
  resources:
    - photo.jpg
    - visualization-sample/
    - tree-system-gif/
    - assets/img/
    - assets/Isabelle-Li-resume.pdf

website:
  title: "Isabelle Li"
  navbar:
    background: primary
    left:
      - text: "Isabelle Li"
        href: index.qmd
    right:
      - text: "Selected work"
        href: index.qmd#work
      - text: "More projects"
        href: index.qmd#more
      - text: "Contact"
        href: index.qmd#contact
      - text: "Résumé"
        href: assets/Isabelle-Li-resume.pdf

format:
  html:
    theme: [cosmo, assets/theme.scss]
    css: [assets/override.css, assets/site.css]
    include-in-header:
      text: |
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/glightbox/dist/css/glightbox.min.css">
        <script src="https://cdn.jsdelivr.net/npm/glightbox/dist/js/glightbox.min.js"></script>
        <script>document.addEventListener('DOMContentLoaded',function(){if(typeof GLightbox!=='undefined'){GLightbox({selector:'.glightbox',touchNavigation:true,loop:false,zoomable:true});}});</script>

execute:
  freeze: auto
